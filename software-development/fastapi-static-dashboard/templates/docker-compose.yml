services:
  app:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - ./.forecast:/app/.forecast  # Persist corpus DB
      - ./.cache:/app/.cache        # Persist API caches
    environment:
      - PYTHONPATH=/app

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
